# ============================================================
# University ERP — Complete Bundle
# docker-compose.yml
#
# Services:
#   backend-node   — Node/Express (auth, super-admin, venues)  → port 5000
#   backend-spring — Spring Boot  (books, clubs, sports, certs) → port 8080
#   frontend       — React/Vite   (all pages)                  → port 5173
#
# Usage:
#   Start all:   docker-compose up --build
#   Stop all:    docker-compose down
#   Logs:        docker-compose logs -f
#   One service: docker-compose up --build backend-node
# ============================================================

services:

  # ── Node / Express / MongoDB backend ──────────────────────
  backend-node:
    build:
      context: ./backend-node-express-mongo
      dockerfile: Dockerfile
    container_name: erp-backend-node
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    env_file:
      - .env
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Spring Boot backend ────────────────────────────────────
  backend-spring:
    build:
      context: ./backend-springboot
      dockerfile: Dockerfile
    container_name: erp-backend-spring
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
      SPRING_DATA_MONGODB_DATABASE: ${SPRING_DATA_MONGODB_DATABASE:-university-erp}
    env_file:
      - .env
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── React / Vite frontend ──────────────────────────────────
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Tell Vite's proxy where the backends live inside Docker network.
      # These override the localhost fallbacks in vite.config.js.
      VITE_NODE_API_URL: http://backend-node:5000
      VITE_SPRING_API_URL: http://backend-spring:8080
    depends_on:
      backend-node:
        condition: service_healthy
      backend-spring:
        condition: service_started
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge
